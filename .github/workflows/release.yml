name: Release

on:
    push:
        tags:
            - 'v*'

permissions:
    contents: write

jobs:
    release:
        runs-on: ubuntu-latest
        env:
            # Gate npm publish on presence of secret (empty string if secret is unset)
            NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        steps:
            - uses: actions/checkout@v6
            - uses: oven-sh/setup-bun@v2
            - uses: actions/setup-node@v4
              with:
                  node-version: '20'
                  registry-url: 'https://registry.npmjs.org'
            - run: bun install
            - name: Sync APP_VERSION from tag
              run: |
                  export VERSION="${GITHUB_REF#refs/tags/v}"
                  echo "Releasing version: $VERSION"
                  # Web app version banner embedded into the bundle (shown in Settings).
                  printf "export const APP_VERSION = '%s'\n" "$VERSION" > shared/src/buildInfo.ts
                  # Keep cli package + platform optionalDependencies in lockstep with the tag.
                  node -e "const f='cli/package.json';const p=require('./'+f);p.version=process.env.VERSION;for(const k of Object.keys(p.optionalDependencies||{})){p.optionalDependencies[k]=process.env.VERSION;}require('fs').writeFileSync(f,JSON.stringify(p,null,2)+'\n')"
            - run: bun run build:single-exe:all
            - name: Package release artifacts
              run: |
                  cd cli/dist-exe
                  mkdir -p ../release-artifacts

                  for dir in bun-*/; do
                      target="${dir%/}"
                      # bun-darwin-arm64 -> hapi-darwin-arm64
                      name="hapi-${target#bun-}"
                      name="${name/windows/win32}"
                      # Strip Bun build variant suffixes (e.g. linux-x64-baseline -> linux-x64)
                      name="${name%-baseline}"
                      name="${name%-modern}"

                      if [[ "$target" == *"windows"* ]]; then
                          zip -j "../release-artifacts/${name}.zip" "$target"/hapi.exe
                      else
                          tar -czvf "../release-artifacts/${name}.tar.gz" -C "$target" hapi
                      fi
                  done

                  cd ../release-artifacts
                  sha256sum * > checksums.txt
            - name: Create Release
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  gh release create "${GITHUB_REF#refs/tags/}" \
                      --title "Release ${GITHUB_REF#refs/tags/}" \
                      --generate-notes \
                      cli/release-artifacts/*
            - name: Prepare npm packages
              if: ${{ env.NPM_TOKEN != '' }}
              working-directory: cli
              run: bun run prepare-npm-packages
            - name: Publish platform packages to npm
              if: ${{ env.NPM_TOKEN != '' }}
              env:
                  NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
              run: |
                  for platform in darwin-arm64 darwin-x64 linux-arm64 linux-x64 win32-x64; do
                      echo ">>> Publishing @dmnkf/hapi-$platform"
                      (cd cli/npm/$platform && npm publish --access public) || echo "Skipping $platform (may already be published)"
                  done
            - name: Publish main npm package
              if: ${{ env.NPM_TOKEN != '' }}
              env:
                  NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
              run: |
                  echo ">>> Publishing @dmnkf/hapi"
                  (cd cli/npm/main && npm publish --access public) || echo "Skipping main (may already be published)"
            - name: Update Homebrew formula
              continue-on-error: true
              env:
                  GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
              run: |
                  VERSION="${GITHUB_REF#refs/tags/v}"
                  cd cli && bun run update-homebrew-formula --version "$VERSION" --push
